name: Module CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        suite: [core, advanced, composition, rendering, consumer, public-paper, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.100'
      - run: bash ci/bootstrap.sh
      - run: bash ci/render-bootstrap.sh
      - run: python -m pytest -q tests/test_operations.py tests/test_native_modules.py tests/test_templates.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'core'
      - run: python -m pytest -q tests/test_compose.py tests/test_merge.py tests/test_task.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'composition'
      - run: python -m pytest -q tests/test_advanced.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'advanced'
      - run: python -m pytest -q tests/test_consumer.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'consumer'
      - run: python -m pytest -q tests/test_public_paper.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'public-paper'
      - run: python -m pytest -q tests/test_distribution.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'distribution'
      - run: python -m pytest -q tests/test_render.py --basetemp=build/test-work --junitxml=build/tests.xml
        if: matrix.suite == 'rendering'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: module-ci-${{ matrix.suite }}-${{ github.run_id }}
          path: build/
          retention-days: 30
