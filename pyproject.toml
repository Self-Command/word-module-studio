[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "word-module-studio"
version = "0.1.0"
description = "Composable cloud-only DOCX operations and verified template execution"
requires-python = ">=3.12"
license = "Apache-2.0"

[project.scripts]
word-studio = "word_module_studio.client:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
